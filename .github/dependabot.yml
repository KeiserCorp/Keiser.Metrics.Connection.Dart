# Dependabot configuration — security updates only (SOC 2 Type 2 patch management).
#
# Every entry sets open-pull-requests-limit: 0, which disables version-update PRs
# (routine bumps) while Dependabot security updates keep opening one PR per
# Dependabot alert that has a fix. Security-update PRs reuse each entry's labels
# and commit-message prefix. Routine dependency upgrades are done by hand.
#
# Requires repo settings: Dependabot alerts and Dependabot security updates
# (Settings > Code security) both enabled.
#
# Reviewer assignment (ish2028) lives in .github/CODEOWNERS: GitHub removed the
# `reviewers` key from dependabot.yml on 2025-05-20 in favor of code owners.
#
# Not covered on purpose: none (no submodules; no npm or Docker manifests in this repo).
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    labels:
      - "dependencies"
      - "pub"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 0
